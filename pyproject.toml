[build-system]
requires = ["setuptools>=75.6.0", "setuptools_scm[toml]>=5.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ape-foundry"
description = "ape-foundry: Ape network provider for Foundry"
readme = "README.md"
authors = [
    {name = "ApeWorX Ltd.", email = "admin@apeworx.io"}
]
license = "Apache-2.0"
keywords = ["ethereum"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.10"
dependencies = [
    "eth-ape>=0.8.34,<0.9",
    "eth_pydantic_types>=0.2.0,<0.3",
    "evm-trace>=0.2.3,<0.3",
    "ethpm-types>=0.6.19,<0.7",  # Use same version as eth-ape
    "hexbytes>=0.3.1,<2",
    "web3>=6.20.1,<8",
    "yarl>=1.9.2,<2",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/ApeWorX/ape-foundry"

[dependency-groups]
docs = [
    "sphinx-ape",
]
test = [
    "pytest>=6.0",
    "pytest-xdist",
    "pytest-cov",
    "hypothesis>=6.2.0,<7",
    "pytest-mock",
    "pytest-benchmark",
    "ape-alchemy>=0.8.9",
    "ape-polygon",
    "ape-optimism",
    "ape-tokens",

]
lint = [
    "mypy>=1.15.0,<2",
    "types-setuptools",
    "ruff>=0.9.0",
    "mdformat>=0.7.22",
    "mdformat-gfm>=0.3.5",
    "mdformat-frontmatter>=0.4.1",
    "mdformat-pyproject>=0.0.2",
]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "docs"},
    "commitlint",
    "prek",
    "pytest-watch",
    "IPython",
    "ipdb",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*"]

[tool.setuptools.package-data]
ape_foundry = ["py.typed"]

[tool.setuptools_scm]
write_to = "ape_foundry/version.py"

[tool.mypy]
exclude = "build/"
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger (catches breakpoint/pdb)
    "T20",    # flake8-print
    "PYI",    # flake8-pyi
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "TC",     # flake8-type-checking
    "ARG",    # flake8-unused-arguments
]
ignore = [
    "TC003",  # Move stdlib import into TYPE_CHECKING block
]

[tool.ruff.lint.per-file-ignores]
"ape_foundry/**/*.py" = ["RET504", "RET505", "SIM105", "N812", "PYI051", "SIM102", "SIM117"]
"version.py" = ["ALL"]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["ARG001", "ARG002", "PT006", "PT007", "PT011", "RET504", "SIM105", "PYI051", "SIM102", "SIM117"]  # Pytest fixtures may appear unused

[tool.ruff.lint.isort]
force-wrap-aliases = true
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = """
    -p no:ape_test
    --cov-branch
    --cov-report term
    --cov-report html
    --cov-report xml
    --cov=ape_foundry
"""
python_files = "test_*.py"
testpaths = "tests"
markers = "fuzzing: Run Hypothesis fuzz test suite"

[tool.mdformat]
number = true
